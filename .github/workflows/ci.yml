
name: CI - Build, Push and Scan

on:
  push:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    name: Build, Push and Scan Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push and scan using composite action
        id: build-and-scan
        uses: ./.github/actions/build-and-scan
        with:
          image_name: github-actions-homework
          tag: ${{ github.sha }}

      - name: Print published image URI
        shell: bash
        env:
          IMAGE_URI: ${{ steps.build-and-scan.outputs.image_uri }}
        run: |
          echo "Published image URI: $IMAGE_URI"
